# Bootstrap version. This project is versioned by its own plugin, which cannot be applied until it
# has been published at least once - see design.md, "Bootstrap sequence". Removed in favour of the
# calculated version once the first snapshot is consumable, at which point the plugin must compute
# exactly this string for a repository with no recorded release.
version=1.0.0-SNAPSHOT

org.gradle.caching=true
org.gradle.configuration-cache=true
# org.gradle.unsafe.isolated-projects is off for this build, not for builds that consume the plugin.
# info.solidsoft.pitest reaches into the root project's buildscript from every project it is applied
# to, which isolated projects forbids and the plugin offers no way to disable. This was harmless
# while the root was the only project; splitting into modules made it real. The guarantee this
# project makes is that a *consuming* build works under isolated projects, and the smoke tests assert
# that against generated multi-project builds that do not apply pitest.
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.problems.report=true
