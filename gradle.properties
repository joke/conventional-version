org.gradle.caching=true
org.gradle.configuration-cache=true
# org.gradle.unsafe.isolated-projects is off for this build, not for builds that consume the plugin.
# info.solidsoft.pitest reaches into the root project's buildscript from every project it is applied
# to, which isolated projects forbids and the plugin offers no way to disable. This was harmless
# while the root was the only project; splitting into modules made it real. The guarantee this
# project makes is that a *consuming* build works under isolated projects. Nothing asserts that by
# execution any more: it rests on AssignVersion declaring what it captures and touching only the
# project it is handed. Read that class before changing it.
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.problems.report=true
