# Bootstrap version. This project is versioned by its own plugin, which cannot be applied until it
# has been published at least once - see design.md, "Bootstrap sequence". Removed in favour of the
# calculated version once the first snapshot is consumable, at which point the plugin must compute
# exactly this string for a repository with no recorded release.
version=1.0.0-SNAPSHOT
group=io.github.joke

org.gradle.caching=true
org.gradle.configuration-cache=true
# A plugin that promises isolated projects compatibility should be built under it. jspecify has this
# off because info.solidsoft.pitest reaches into the root project's buildscript from every project it
# is applied to; that is a no-op here, where the root project is the only project. Verified with a
# full `check`, pitest included.
org.gradle.unsafe.isolated-projects=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.problems.report=true
