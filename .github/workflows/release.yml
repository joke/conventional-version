name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: GoogleCloudPlatform/release-please-action@v5.0
      id: release
      with:
        release-type: simple

  # Only runs when release-please actually cut a release. The Gradle Plugin Portal treats every
  # version as immutable and rejects -SNAPSHOT, so publishing is only ever correct from a release
  # commit - which is also the only commit where the plugin resolves a bare version.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.release-please.outputs.tag_name }}
        fetch-depth: 0
    - uses: jdx/mise-action@v4
    - uses: gradle/actions/setup-gradle@v6
    # --no-configuration-cache because com.gradle.plugin-publish's PublishTask holds a Project, a
    # SourceSet and a Publication, none of which the configuration cache can serialise. Upstream
    # limitation, scoped to this one invocation; `check` runs with the cache enabled as normal.
    # These environment variable names are fixed by com.gradle.plugin-publish. An ORG_GRADLE_PROJECT_
    # prefix would not work here however it is spelled - that prefix sets a *project property* of the
    # same name, and the properties this plugin reads are `gradle.publish.key` and
    # `gradle.publish.secret`, which no environment variable name can express because of the dots.
    # Plain environment variables are the documented CI route.
    - run: ./gradlew publishPlugins --no-configuration-cache
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
