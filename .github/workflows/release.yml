name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.0.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    # No `with:`. The release type and everything else live in release-please-config.json, which the
    # action finds on its own - the same file the plugin reads, so the two cannot disagree about how
    # this repository is released.
    - uses: GoogleCloudPlatform/release-please-action@v5.0
      id: release

  fidelity:
    # The pending release pull request names the version release-please intends to cut, and predicting
    # that number is this plugin's whole correctness claim. release-please can change its bump rules
    # under us, so the claim is checked here on every push rather than discovered as a wrong
    # coordinate on the portal. The pull request is found by release-please's own label rather than by
    # branch name or action output, neither of which is stable across its versions.
    needs: release-please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        # The pushed commit, which is the history release-please just read. The pull request head is
        # deliberately not used: it already carries the CHANGELOG entry for the version being cut,
        # which the plugin would read back as the base version.
        fetch-depth: 0
    - uses: jdx/mise-action@v4
    - uses: gradle/actions/setup-gradle@v6.2.0
    - name: Compare the calculated version with release-please
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        title="$(gh pr list --state open --label 'autorelease: pending' --json title --jq '.[0].title')"
        if [ -z "$title" ]; then
          echo 'No pending release pull request; nothing to compare.'
          exit 0
        fi
        expected="${title##* }-SNAPSHOT"
        actual="$(./gradlew -q properties | sed -n 's/^version: //p')"
        echo "release-please: $expected"
        echo "plugin:         $actual"
        if [ "$expected" != "$actual" ]; then
          echo "::error::The plugin calculated $actual, but release-please will cut ${title##* }"
          exit 1
        fi

  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
        fetch-depth: 0
    - uses: jdx/mise-action@v4
    - uses: gradle/actions/setup-gradle@v6.2.0
    # No -Pversion: the plugin versions this project, and on the release commit it resolves to the
    # bare release version on its own. An override that agreed would add nothing, and one that
    # disagreed would hide the disagreement.
    - run: ./gradlew publishPlugins
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
