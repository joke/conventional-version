group = 'io.github.joke'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

pluginManager.withPlugin('java') {
    pluginManager.apply 'com.diffplug.spotless'
    pluginManager.apply 'net.ltgt.errorprone'
    pluginManager.apply 'pmd'

    dependencies {
        compileOnly 'org.jspecify:jspecify:1.0.0'
        compileOnly 'org.jetbrains:annotations:26.1.0'

        testImplementation platform('org.spockframework:spock-bom:2.4-groovy-4.0')
        testImplementation 'org.spockframework:spock-core'

        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testRuntimeOnly 'net.bytebuddy:byte-buddy:1.17.8'
        testRuntimeOnly 'org.objenesis:objenesis:3.4'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Werror', '-parameters', '-Xmaxwarns', '10000', '-Xmaxerrs', '10000']
        options.fork = true
        options.forkOptions.jvmArgs += ['--sun-misc-unsafe-memory-access=allow']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxParallelForks = Runtime.runtime.availableProcessors()
        maxHeapSize = '2g'
        jvmArgs '-XX:+HeapDumpOnOutOfMemoryError', '-XX:+CrashOnOutOfMemoryError', '-XX:+EnableDynamicAgentLoading'
    }
}

// Mutation testing needs production classes to mutate. A module without any would fail
// `failWhenNoMutations` before doing anything useful.
pluginManager.withPlugin('java') {
    if (file('src/main/java').directory) {
        pluginManager.apply 'info.solidsoft.pitest'
    }
}

pluginManager.withPlugin('com.diffplug.spotless') {
    spotless {
        java {
            forbidWildcardImports()
            removeUnusedImports()
            palantirJavaFormat('2.87.0')
        }
    }
}

pluginManager.withPlugin('net.ltgt.errorprone') {
    pluginManager.apply 'net.ltgt.nullaway'
    dependencies {
        errorprone 'com.google.errorprone:error_prone_core:2.49.0'
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableWarningsInGeneratedCode = true
        }
    }
}

pluginManager.withPlugin('net.ltgt.nullaway') {
    dependencies {
        errorprone 'com.uber.nullaway:nullaway:0.13.4'
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            error 'RequireExplicitNullMarking'
            nullaway {
                error()
                onlyNullMarked = true
                treatGeneratedAsUnannotated = true
                jspecifyMode = true
                suggestSuppressions = true
                checkContracts = true
                acknowledgeRestrictiveAnnotations = true
            }
        }
    }
}

pluginManager.withPlugin('pmd') {
    pmd {
        consoleOutput = false
        toolVersion = '7.26.0'
        rulesMinimumPriority = 5
        ruleSets = ["$rootDir/.pmd.xml"]
    }
}

pluginManager.withPlugin('groovy') {
    pluginManager.apply 'codenarc'
    codenarc {
        configFile = file("$rootDir/.codenarc.groovy")
        maxPriority1Violations = 0
        maxPriority2Violations = 0
        maxPriority3Violations = 0
    }
    dependencies {
        codenarc 'org.codenarc:CodeNarc:3.7.0-groovy-4.0'
    }
    tasks.withType(CodeNarc).configureEach {
        reports {
            xml.required = false
            html.required = true
            text.required = true
        }
    }
}

pluginManager.withPlugin('info.solidsoft.pitest') {
    pitest {
        targetClasses = ['io.github.joke.conventionalversion.*']
        outputFormats = ['XML', 'HTML']
        pitestVersion = '1.25.8'
        junit5PluginVersion = '1.2.3'
        mutators = ['ALL']
        enableDefaultIncrementalAnalysis = true
        timestampedReports = false
        threads = Runtime.runtime.availableProcessors()
        jvmArgs = ['-XX:+EnableDynamicAgentLoading', '-Dspock.parallel.disabled=true']
        failWhenNoMutations = true
        mutationThreshold = 100
        coverageThreshold = 100
        testStrengthThreshold = 100
    }
    dependencies {
        pitest 'org.pitest:pitest-history-plugin:0.0.1'
    }
    tasks.named('check') { dependsOn 'pitest' }
}

pluginManager.withPlugin('java-gradle-plugin') {
    pluginManager.apply 'com.gradle.plugin-publish'
}

pluginManager.withPlugin('com.gradle.plugin-publish') {
    tasks.named('publishPlugins') {
        def declaredVersion = providers.provider { project.version.toString() }
        doFirst {
            if (declaredVersion.get().endsWith('-SNAPSHOT')) {
                throw new GradleException(
                        "Refusing to publish ${declaredVersion.get()}: the Gradle Plugin Portal rejects SNAPSHOT " +
                                'versions. Publish from a release commit, where the version resolves to a bare ' +
                                'release version.')
            }
        }
    }
}
